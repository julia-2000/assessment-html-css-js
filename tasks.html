<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Header -->
    <header>
        <!-- Logo -->
        <a href="index.html"><img src="images/GE_Logo-inline-on-white.png" alt="Gelos Enterprises Logo"
                class="logo"></a>
        <!-- Menu with links -->
        <nav>
            <ul class="menu">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="tasks.html">Tasks</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contant -->
    <main>
        <!-- Title and Subtitle -->
        <div class="main-titles">
            <h1>Task Manager System</h1>
            <h2>Instructions for using the Task Manager</h2>
        </div>

        <!-- Cards with instructions -->
        <div class="tasks-container">
            <div class="add-task">

                <!-- Icon and Title -->
                <div class="top-task">
                    <img src="images/folder-plus-solid-full.svg" alt="Folder with plus icon" class="task-icon"></img>
                    <h3>Add New Task</h3>
                </div>

                <!-- Add New Task Form -->
                <div class="add-task-form">
                    <label for="taskName">Task Name *</label>
                    <input type="text" name="taskName" id="taskName" placeholder="Enter task name">
                    <label for="priorityLevel">Priority Level *</label>
                    <select type="text" name="priorityLevel" id="priorityLevel">
                        <option value="default">Select priority</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                    <label for="dueDate">Due Date *</label>
                    <input type="date" name="dueDate" id="dueDate">
                    <label for="consultant">Consultant</label>
                    <select name="consultant" id="consultant">
                        <option value="default" selected="selected">Select role</option>
                        <br>
                        <option value="Accounts Clerk">Accounts Clerk (Payable)</option>
                        <br>
                        <option value="Administration Assistant">Administration Assistant</option>
                        <br>
                        <option value="Brand Coordinator">Brand Coordinator</option>
                        <br>
                        <option value="Call Centre Manager">Call Centre Manager</option>
                        <br>
                        <option value="Call Centre Operator">Call Centre Operator</option>
                        <br>
                        <option value="Cyber Security Engineer">Cyber Security Engineer</option>
                        <br>
                        <option value="Database Development Team Leader">Database Development Team Leader</option>
                        <br>
                        <option value="Digital Media Coordinator">Digital Media Coordinator</option>
                        <br>
                    </select>
                    <button class="btn-add" id="btnAddNewTask">
                        <img src="images/plus.png" alt="Plus icon" class="plus-icon">
                        Add Task</button>
                </div>
            </div>

            <div class="search-display-container">

                <!-- Search Tasks -->
                <div class="search-tasks">

                    <!-- Icon and Title -->
                    <div class="top-task">
                        <img src="images/search-glass-solid-full.svg" class="task-icon"
                            alt="Folder with plus icon"></img>
                        <h3>Search Tasks</h3>
                    </div>

                    <!-- Search Container -->
                    <div class="search-container">
                        <input type="text" class="input-box" id="search" name="search" placeholder="Search..."
                            aria-label="Search through site content">
                        <img src="images/search-glass-solid-full.svg" id="iconSearch" class="search-icon"
                            alt="Folder with plus icon">
                        </img>
                    </div>
                    <!-- Message -->
                    <div id="message">

                    </div>


                </div>

                <!-- Display Tasks -->
                <div class="display-tasks">
                    <!-- Icon and Title -->
                    <div class="top-task">
                        <img src="images/hamburger-menu.svg" class="task-icon" alt="Folder with plus icon"></img>
                        <h3>Display Tasks</h3>
                    </div>
                    <!-- Table Container -->
                    <div class="table-container">
                        <table id="">
                            <thead>
                                <tr>
                                    <!-- <th>#</th> -->
                                    <th>Task Name</th>
                                    <th>Due Date</th>
                                    <th>Priority</th>
                                    <th>Consultant</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="tasksTableBody">

                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <!-- Fotter Policy Links -->
        <ul>
            <li><a href="policy/GE_Privacy-policy.pdf" download>Privacy Policy</a></li>
            <li><a href="">|</a></li>
            <li><a href="policy/GE_Internet-usage-policy.pdf" download>Internet Usage Policy</a></li>
        </ul>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
